name: Product branch verification
on:
  push:
    branches: [product-next]
  pull_request:
    branches: [product-next]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm run build:offline
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: sequence-workshop-next-offline
          path: 序列工坊_离线单文件版.html
# Deliberately no Pages deployment, main push, release publication or write permission.
